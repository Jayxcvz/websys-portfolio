<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome — JClixks.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@700;800&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    /* Ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0;
      animation: orbFade 1.2s ease forwards;
      pointer-events: none;
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      top: -120px;
      left: -100px;
      background: radial-gradient(circle, rgba(120, 80, 255, 0.35) 0%, transparent 70%);
      animation-delay: 0.2s;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      bottom: -80px;
      right: -60px;
      background: radial-gradient(circle, rgba(0, 180, 255, 0.28) 0%, transparent 70%);
      animation-delay: 0.4s;
    }

    @keyframes orbFade {
      to {
        opacity: 1;
      }
    }

    /* Main wrapper */
    .splash {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      opacity: 0;
      animation: splashIn 0.8s ease 0.3s forwards;
    }

    @keyframes splashIn {
      to {
        opacity: 1;
      }
    }

    /* Logo area */
    .splash-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .splash-logo img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(150, 100, 255, 0.5));
      animation: logoPulse 2.5s ease-in-out infinite;
    }

    @keyframes logoPulse {

      0%,
      100% {
        filter: drop-shadow(0 0 20px rgba(150, 100, 255, 0.45));
      }

      50% {
        filter: drop-shadow(0 0 38px rgba(150, 100, 255, 0.8));
      }
    }

    .splash-logo-name {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 40%, rgba(180, 140, 255, 0.9) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .splash-tagline {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
    }

    /* Progress bar */
    .progress-wrap {
      width: min(320px, 70vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7c4dff, #40c4ff);
      border-radius: 2px;
      animation: fillBar 4.6s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
    }

    @keyframes fillBar {
      0% {
        width: 0%;
      }

      60% {
        width: 72%;
      }

      85% {
        width: 90%;
      }

      100% {
        width: 100%;
      }
    }

    .progress-label {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.28);
    }

    /* Dots loader */
    .dots {
      display: flex;
      gap: 8px;
    }

    .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotBounce {

      0%,
      80%,
      100% {
        transform: scale(1);
        opacity: 0.35;
      }

      40% {
        transform: scale(1.5);
        opacity: 1;
      }
    }

    /* Fade-out overlay */
    .fade-out-overlay {
      position: fixed;
      inset: 0;
      background: #080808;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .fade-out-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>

<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="fade-out-overlay" id="fadeOverlay"></div>

  <div class="splash">
    <div class="splash-logo">
      <img src="WelcomeIcon.png" alt="JClixks Logo" />
      <div class="splash-logo-name">JClixks.</div>
      <div class="splash-tagline">Capture Every Story</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="progress-label">Loading experience</div>
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <script>
    // After 5 seconds: fade out then redirect to index.html
    setTimeout(function () {
      var overlay = document.getElementById('fadeOverlay');
      overlay.classList.add('active');
      setTimeout(function () {
        window.location.href = 'index.html';
      }, 650);
    }, 5000);
  </script>

</body>

</html>
